<div class="page-header">
  <div>
    <h2>Reports</h2>
    <p>View and manage submitted incident and summary reports</p>
  </div>
</div>

<div class="card">
  <table>
    <thead>
      <tr>
        <th>Title</th>
        <th>Type</th>
        <th>Barangay</th>
        <th>Created By</th>
        <th>Date</th>
        <th>Status</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let report of reports">
        <td>{{ report.title }}</td>
        <td>{{ report.type }}</td>
        <td>{{ report.barangay }}</td>
        <td>{{ report.createdBy }}</td>
        <td>{{ report.dateCreated }}</td>
        <td>{{ report.status }}</td>
        <td><a [routerLink]="['/reports', report.id]" class="secondary-btn">View</a></td>
      </tr>
    </tbody>
  </table>

  <div class="table-empty" *ngIf="reports.length === 0">
    <p>No reports found</p>
  </div>
</div>
